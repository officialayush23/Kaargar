[alembic]
# Migration scripts live in BACKEND/alembic/versions.
script_location = alembic

# sqlalchemy.url is intentionally left blank here — alembic/env.py sets it
# programmatically from config.get_settings().database_url_direct (falling
# back to database_url), the same Settings class the app itself uses. This
# keeps the DB credential in exactly one place (.env) instead of duplicated
# into this file.
sqlalchemy.url =

# Standard timestamp-prefixed revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
